    origin: source-derived
    note: "D-07：整句去空白（不含【】記號）；提示不強擋"
    sourceRef: {file: 作業, heading: "1-A　我服務誰"}
  # ---- 1-B ---------------------------------------------------------------
  stage1.t1.b.quote_auto:
    op: joinNonEmpty
    inputs: [stage1.t1.b.did, stage1.t1.b.invest, stage1.t1.b.result]
    sep: "，"
    end: "。"
    origin: source-derived
    sourceRef: {file: 作業, heading: "1-B　我解決什麼問題"}
  stage1.t1.b.sentence_auto:
    op: template
    template: "我幫他解決的問題是，從【{{stage1.t1.b.from}}】，變成【{{stage1.t1.b.to}}】。"
    sourceRef: {file: 作業, heading: "1-B　我解決什麼問題"}
  stage1.t1.b.learn_check:
    op: regexAbsent
    input: stage1.t1.b.to
    pattern: "學會"
    tone: bad
    bad: "後半段有寫成「學會 OO」嗎？那是你教的東西，不是他要的結果。他要的是那件事變得不一樣。"
    origin: source-derived
    note: "D-10：只擋「學會」"
    sourceRef: {file: 作業, heading: "1-B　我解決什麼問題"}
  stage1.t1.b.learn_hint:
    op: regexAbsent
    input: stage1.t1.b.to
    pattern: "學到|學習"
    tone: neutral
    bad: "「學到」「學習」也偏向你教的東西，再想一下：他要的是什麼變得不一樣？"
    origin: authored
    note: "D-10：中性提醒，不算錯誤"
  # ---- 1-C ---------------------------------------------------------------
  stage1.t1.c.tip:
    op: switch
    input: stage1.t1.c.tried
    cases:
      "no": "建議選 A 經歷型\n他還沒被市場教育過，這時候最有效的是讓他覺得「你懂我的處境」。\n方法型會被當成「又一個在賣課的」，結果型會被懷疑「你行不代表我行」。"
      "yes": "建議選 B 方法型\n他已經聽過三次「我很懂你」了，再多一次沒有用。\n他要的是一個具體的、可以複述給別人聽的差異點——你的做法跟前面那幾家哪裡不一樣。"
    sourceRef: {file: 作業, heading: "1-C　為什麼是你"}
  stage1.t1.c.c_warn:
    op: cases
    origin: source
    cases:
      - {when: {input: stage1.t1.c.angle, equals: C}, template: "一項都沒中，就先不要選 C。\n不是你的成果不好，是陌生人沒有理由相信一個他沒聽過的人講的數字。", tone: bad}
    sourceRef: {file: 作業, heading: "1-C　為什麼是你"}
  stage1.t1.c.sentence_a_auto: {op: template, template: "我以前也【{{stage1.t1.c.a1}}】，後來我【{{stage1.t1.c.a2}}】。", sourceRef: {file: 作業, heading: "1-C　為什麼是你"}}
  stage1.t1.c.sentence_b_auto: {op: template, template: "我有一套【{{stage1.t1.c.b1}}】，專門解決【{{stage1.t1.c.b2}}】。", sourceRef: {file: 作業, heading: "1-C　為什麼是你"}}
  stage1.t1.c.sentence_c_auto: {op: template, template: "我做過【{{stage1.t1.c.c1}}】，達成【{{stage1.t1.c.c2}}】。", sourceRef: {file: 作業, heading: "1-C　為什麼是你"}}
  stage1.t1.c.sentence_active:
    op: cases
    cases:
      - {when: {input: stage1.t1.c.angle, equals: A}, template: "{{stage1.t1.c.sentence_a}}"}
      - {when: {input: stage1.t1.c.angle, equals: B}, template: "{{stage1.t1.c.sentence_b}}"}
      - {when: {input: stage1.t1.c.angle, equals: C}, template: "{{stage1.t1.c.sentence_c}}"}
  stage1.t1.done.len80:
    op: charCount
    inputs: [stage1.t1.a.sentence, stage1.t1.b.sentence, stage1.t1.c.sentence_active]
    labels: ["1-A", "1-B", "1-C"]
    max: 80
    good: "三句話加起來 {{n}} 個字，沒有超過 {{max}} 個字。"
    bad: "三句話加起來 {{n}} 個字，超過 {{max}} 個字了。"
    incomplete: "還缺：{{missing}}"
    origin: source-derived
    note: "D-07：三句整句去空白後合計"
    sourceRef: {file: 作業, heading: "任務 1 完成標準"}
  stage1.t1.done.all_three:
    op: template
    template: "{{stage1.t1.a.sentence}}\n{{stage1.t1.b.sentence}}\n{{stage1.t1.c.sentence_active}}"
    blank: "（未填）"
    sourceRef: {file: 作業, heading: "任務 1 完成標準"}
  # ---- 任務 3 ------------------------------------------------------------
  stage1.t3.b.score: {op: countEquals, inputs: [stage1.t3.b.s1, stage1.t3.b.s2, stage1.t3.b.s3, stage1.t3.b.s4, stage1.t3.b.s5, stage1.t3.b.s6], equals: yes, sourceRef: {file: 作業, heading: "3-B　追客 or 篩客？自我檢測"}}
  stage1.t3.b.score_left: {op: countEquals, output: left, leftText: "還有 {{n}} 題沒答", inputs: [stage1.t3.b.s1, stage1.t3.b.s2, stage1.t3.b.s3, stage1.t3.b.s4, stage1.t3.b.s5, stage1.t3.b.s6], equals: yes, origin: authored}
  stage1.t3.b.score_text: {op: format, template: "{{stage1.t3.b.score}}", sourceRef: {file: 作業, heading: "3-B　追客 or 篩客？自我檢測"}}
  stage1.t3.b.verdict:
    op: band
    input: stage1.t3.b.score
    output: label
    bands:
      - {min: 0, max: 1, label: "已經偏篩客型", detail: "系統化之後會放大很快"}
      - {min: 2, max: 4, label: "混合型", detail: "多數人在這裡"}
      - {min: 5, max: 6, label: "典型追客型", detail: "這套系統對你的改變會最大"}
    sourceRef: {file: 作業, heading: "3-B　追客 or 篩客？自我檢測"}
  stage1.t3.b.detail:
    op: band
    input: stage1.t3.b.score
    output: detail
    bands:
      - {min: 0, max: 1, label: "已經偏篩客型", detail: "系統化之後會放大很快"}
      - {min: 2, max: 4, label: "混合型", detail: "多數人在這裡"}
      - {min: 5, max: 6, label: "典型追客型", detail: "這套系統對你的改變會最大"}
    sourceRef: {file: 作業, heading: "3-B　追客 or 篩客？自我檢測"}
  stage1.t3.c.gaps:
    op: whereAny
    output: labels
    origin: source-derived
    note: "R04／D-11：流量、交付＝原文；篩選（心裡有數不算）、成交（報價不算）＝原文提醒的詮釋，學員可手動覆寫"
    rules:
      - {label: "流量 → 階段四（Meta 廣告）", input: stage1.t3.a.flow, includesAny: [none], orEmpty: true}
      - {label: "篩選 → 階段五（銷售頁 + 官方 LINE）", input: stage1.t3.a.screen, includesAny: [no_screen, mind_only, none]}
      - {label: "成交 → 階段六（銷售流程）", input: stage1.t3.a.close, includesAny: [quote, none]}
      - {label: "交付 → 階段二（產品與定位）", input: stage1.t3.a.deliver, includesAny: [none], orEmpty: true}
    sourceRef: {file: 作業, heading: "3-C　找出你的破口"}
  stage1.t3.c.gaps_ord:
    op: whereAny
    output: ordinals
    origin: source-derived
    rules:
      - {label: "流量", input: stage1.t3.a.flow, includesAny: [none], orEmpty: true}
      - {label: "篩選", input: stage1.t3.a.screen, includesAny: [no_screen, mind_only, none]}
      - {label: "成交", input: stage1.t3.a.close, includesAny: [quote, none]}
      - {label: "交付", input: stage1.t3.a.deliver, includesAny: [none], orEmpty: true}
    sourceRef: {file: 作業, heading: "3-C　找出你的破口"}
  stage1.t3.done.boxes_ok: {op: joinNonEmpty, requireAll: true, inputs: [stage1.t3.a.flow, stage1.t3.a.screen, stage1.t3.a.close, stage1.t3.a.deliver], sep: "｜"}
  stage1.t3.done.priority_ok: {op: joinNonEmpty, requireAll: true, inputs: [stage1.t3.c.priority]}
  # ---- 任務 4 ------------------------------------------------------------
  stage1.t4.a.identity_auto: {op: template, template: "我要找的人是【{{stage1.t1.a.state}}】的【{{stage1.t1.a.identity}}】。", sourceRef: {file: 作業, heading: "4-A　C｜我要用廣告找到的人"}}
  stage1.t4.b.often_list:
    op: whereAny
    output: labels
    rules:
      - {label: "① 有沒有人來問你，要你保證結果？", input: stage1.t4.b.f1, includesAny: [often]}
      - {label: "② 有沒有人希望你直接幫他做完，而不是教他怎麼做？", input: stage1.t4.b.f2, includesAny: [often]}
      - {label: "③ 有沒有人一開口就在比價、問折扣？", input: stage1.t4.b.f3, includesAny: [often]}
    sourceRef: {file: 作業, heading: "4-B　A｜我的銷售頁要篩掉的人"}
  stage1.t4.b.tip:
    op: cases
    cases:
      - {when: {inputs: [stage1.t4.b.f1, stage1.t4.b.f2, stage1.t4.b.f3], allEqual: rare}, template: "三題都勾「幾乎沒有」？代表你的量還不夠大，還沒遇到。先照下面三種都擋，之後有實際案例再調整。"}
      - {when: {inputs: [stage1.t4.b.f1, stage1.t4.b.f2, stage1.t4.b.f3], anyEqual: often}, template: "勾「常常」的那幾題，就是你一定要擋的人。\n{{stage1.t4.b.often_list}}"}
    origin: source-derived
    sourceRef: {file: 作業, heading: "4-B　A｜我的銷售頁要篩掉的人"}
  stage1.t4.b.no_auto:
    op: joinNonEmpty
    inputs: [stage1.t4.b.block, stage1.t4.b.mismatch]
    sep: "、"
    origin: source
    note: "D-08：串「原選項字串」，不改寫（Artifact 的改寫版不採用）"
    sourceRef: {file: 作業, heading: "4-B　A｜我的銷售頁要篩掉的人"}
  stage1.t4.c.q1_auto: {op: orderedList, input: stage1.t4.c.picks, index: 0, note: "D-09：勾選順序＝三題順序（可改）", origin: source-derived}
  stage1.t4.c.q2_auto: {op: orderedList, input: stage1.t4.c.picks, index: 1, origin: source-derived}
  stage1.t4.c.q3_auto: {op: orderedList, input: stage1.t4.c.picks, index: 2, origin: source-derived}
  stage1.t4.d.p1_auto: {op: format, template: "{{stage1.t1.a.state}}的{{stage1.t1.a.identity}}", note: "G-15：由結構化答案組成，不做字串手術", origin: source-derived}
  stage1.t4.d.p2_auto: {op: format, template: "{{stage1.t4.b.no_sentence}}", origin: source-derived}
  stage1.t4.d.p3_auto: {op: format, template: "{{stage1.t4.c.q1}}", origin: source-derived}
  stage1.t4.d.paragraph:
    op: template
    template: "我要用廣告找到【{{stage1.t4.d.p1}}】，\n用銷售頁把【{{stage1.t4.d.p2}}】篩掉，\n剩下的人加我 LINE 之後，我會先問他【{{stage1.t4.d.p3}}】。"
    sourceRef: {file: 作業, heading: "4-D　串成一段話"}
  stage1.t4.done.three_ok: {op: joinNonEmpty, requireAll: true, inputs: [stage1.t4.a.identity_copy, stage1.t4.b.no_sentence, stage1.t4.c.picks], sep: "｜"}
  stage1.t4.done.b_ok: {op: joinNonEmpty, requireAll: true, inputs: [stage1.t4.b.block, stage1.t4.b.mismatch, stage1.t4.b.no_sentence], sep: "｜"}
  # ---- 任務 5 ------------------------------------------------------------
  stage1.t5.a.launch_default: {op: dateAdd, input: stage1.t5.a.today, days: 30, origin: artifact-only, note: "預設上線日＝今天＋30 天；學員可改"}
  stage1.t5.a.launch_eff: {op: firstNonEmpty, inputs: [stage1.t5.a.launch, stage1.t5.a.launch_default], origin: artifact-only}
  stage1.t5.b.w1: {op: weekSplit, start: stage1.t5.a.today, end: stage1.t5.a.launch_eff, parts: 4, index: 0, origin: artifact-only}
  stage1.t5.b.w2: {op: weekSplit, start: stage1.t5.a.today, end: stage1.t5.a.launch_eff, parts: 4, index: 1, origin: artifact-only}
  stage1.t5.b.w3: {op: weekSplit, start: stage1.t5.a.today, end: stage1.t5.a.launch_eff, parts: 4, index: 2, origin: artifact-only}
  stage1.t5.b.w4: {op: weekSplit, start: stage1.t5.a.today, end: stage1.t5.a.launch_eff, parts: 4, index: 3, origin: artifact-only}
  stage1.t5.done.cal_ok: {op: joinNonEmpty, requireAll: true, inputs: [stage1.t5.a.in_calendar]}
  # ---- 附錄 --------------------------------------------------------------
  stage1.app.d.serve: {op: firstNonEmpty, inputs: [stage1.t1.a.sentence]}
  stage1.app.d.solve: {op: format, template: "從{{stage1.t1.b.from}}，變成{{stage1.t1.b.to}}"}
  stage1.app.d.reason: {op: firstNonEmpty, inputs: [stage1.t1.c.sentence_active]}
  stage1.app.d.complaint: {op: firstNonEmpty, inputs: [stage1.t2.a.top, stage1.t1.b.quote], origin: source-derived, note: "G-12：有 2-A 就用 2-A；否則退回 1-B 的暫定那句"}
  stage1.app.d.no: {op: firstNonEmpty, inputs: [stage1.t4.b.no_sentence]}
  stage1.app.d.ask: {op: firstNonEmpty, inputs: [stage1.t4.c.q1]}
  stage1.app.d.launch: {op: dateFormat, input: stage1.t5.a.launch_eff}
  stage1.app.h1_ok: {op: joinNonEmpty, requireAll: true, inputs: [stage1.t2.a.quotes.r1.text, stage1.t2.a.quotes.r2.text, stage1.t2.a.quotes.r3.text, stage1.t2.a.quotes.r4.text, stage1.t2.a.quotes.r5.text, stage1.t2.a.quotes.r6.text, stage1.t2.a.quotes.r7.text, stage1.t2.a.quotes.r8.text, stage1.t2.a.quotes.r9.text, stage1.t2.a.quotes.r10.text], sep: "｜"}
  stage1.app.h2_ok: {op: joinNonEmpty, requireAll: true, inputs: [stage1.t2.b.rows.r1.name, stage1.t2.b.rows.r2.name, stage1.t2.b.rows.r3.name], sep: "｜"}
  stage1.app.h3_ok: {op: joinNonEmpty, requireAll: true, inputs: [stage1.t1.a.sentence, stage1.t1.b.sentence, stage1.t1.c.sentence_active], sep: "｜"}
  stage1.app.h4_ok: {op: joinNonEmpty, requireAll: true, inputs: [stage1.t3.a.flow, stage1.t3.a.screen, stage1.t3.a.close, stage1.t3.a.deliver], sep: "｜"}

pages:
  p.open.1:
    title: 歡迎來到階段一 實作手冊
    sourceRef: {file: 作業, heading: "進度表"}
    blocks:
      - {type: text, q: stage1.open.name}
      - type: prose
        text: |
          | 任務 | 內容 | 需要時間 |
          |---|---|---|
          | 任務 1 | 找出你的本質拷問 | 35 分鐘 |
          | 任務 2 | 查證你的機會存不存在 | 90 分鐘 |
          | 任務 3 | 畫出你現在的商業模式 | 20 分鐘 |
          | 任務 4 | 填出你的 CAS 地圖 | 25 分鐘 |
          | 任務 5 | 排出 30 天上線計畫 | 20 分鐘 |
          | 附錄 | 抄成一頁系統藍圖 | 10 分鐘 |
      - {type: callout, text: "**總計約 3 小時 20 分。建議分 3 次做完，不要一次做完。**"}
  p.open.2:
    title: 使用說明（先看這 5 行）
    sourceRef: {file: 作業, heading: "使用說明"}
    blocks:
      - type: prose
        text: |
          1. **這本不是用讀的，是用寫的。** 沒有填完，這個階段就不算上完。
          2. 印出來寫，或複製到 Google 文件寫，兩種都可以。
          3. **每一題都先看選項，再填自己的。** 大部分題目都給你一組選項，勾完再組成句子——不用憑空想。
          4. **不確定就寫「暫定」，不要停下來想。** 想不出來卡在那裡，是最浪費時間的事。
          5. 每個任務最後都有「完成標準」，達到就打勾往下走，**不用寫到滿意**。
  p.open.lec: {title: 講義 1.0 階段一導讀, lectureChapter: "1.0 階段一導讀"}

  p.t1.lec: {title: 講義 1.1 商業的本質, lectureChapter: "1.1 商業的本質"}
  p.t1.a.1:
    title: "1-A　你的客人，跟這個問題走到哪一步了？"
    sourceRef: {file: 作業, heading: "1-A　我服務誰", step: "步驟 1"}
    blocks:
      - {type: callout, text: "**先弄清楚一件事：這一題問的是「你的客人」，不是「你自己」。**"}
      - {type: choice, q: stage1.t1.a.stage}
      - {type: tip, derived: stage1.t1.a.stage_tip}
      - {type: choice, q: stage1.t1.a.money}
      - {type: callout, text: "**這一格不改變你主打誰，只影響你之後敢開多少價。**"}
      - {type: callout, text: "**這是第一版，之後可以改。** 任務 2 查完市場，你可能會回來改這一格——那是正常的。"}
      - type: details
        summary: 看看別人怎麼勾
        text: |
          | 你是 | A 還沒動作 | B 自己想辦法 | C 花過錢沒解決 | D 有結果想更好 |
          |---|---|---|---|---|
          | **健身教練** | 覺得該運動了 | 辦了會員、跟影片練 | 請過教練、上過課，體態沒變 | 體態不錯，想練專項 |
          | **數學老師** | 還在觀望 | 買評量、自己盯功課 | 正在補習，成績沒起色 | 成績還行，想衝前段 |
          | **紋繡老師** | 想學個手藝 | 看免費教學、自己練 | 上過課拿了證照，接不到客人 | 有客人了，想做教學 |
          | **投資講師** | 想理財 | 看書、聽 podcast | 買過課、跟過老師，還是不敢下單 | 有在賺，想放大部位 |
  p.t1.a.2:
    title: "1-A　套進句子：我服務的是【狀態】的【身分】"
    sourceRef: {file: 作業, heading: "1-A　我服務誰", step: "步驟 3"}
    blocks:
      - {type: text, q: stage1.t1.a.identity, chipsLabel: "參考選項", chips: [上班族, 國中生家長, 新手媽媽, 剛開店的老闆, 退休族, 美睫師, 想轉職的人]}
      - {type: text, q: stage1.t1.a.state, placeholderFrom: stage1.t1.a.state_ph}
      - {type: sentence, q: stage1.t1.a.sentence, title: "我的第一句"}
      - {type: check, derived: stage1.t1.a.len_check}
      - type: prose
        text: |
          **範例：**
          - 我服務的是【請過教練還是沒練起來】的【想改變體態的上班族】
          - 我服務的是【正在補習、但成績一直沒起色】的【國中生家長】
          - 我服務的是【上過課有證照、但接不到客人】的【紋繡師】
  p.t1.b.1:
    title: "1-B　他半夜睡不著時，在想的那件事"
    sourceRef: {file: 作業, heading: "1-B　我解決什麼問題", step: "步驟 1"}
    blocks:
      - {type: choice, q: stage1.t1.b.type}
      - type: callout
        text: |
          **勾不出來？** 就勾 ①。
          你在 1-A 勾的如果是 C（花過錢沒解決），那他的卡法幾乎一定是 ①。這兩題本來就是同一件事的兩面。
      - type: callout
        text: |
          **覺得每個都中？** 那代表你還沒真的聽過客人講話。
          這一題任務 2 會給你答案——**你蒐集回來的 10 句原話，會告訴你他最常卡在哪一種。**
          現在先憑印象勾一個，查完再回來改。
  p.t1.b.2:
    title: "1-B　把它寫成「他會親口說的一句話」"
    sourceRef: {file: 作業, heading: "1-B　我解決什麼問題", step: "步驟 2"}
    blocks:
      - type: prose
        text: |
          你在步驟 1 勾的那一句，是**你的講法**。客人不會那樣說話。
          這一步要把它翻譯成**他自己會講的話**——因為之後你寫的每一則廣告，開頭都是這句話。
          不用你發明。照下面三格組起來就好。
      - type: pickerGroup
        items:
          - {q: stage1.t1.b.did, title: "① 他做過什麼？（勾一個）"}
          - {q: stage1.t1.b.invest, title: "② 投入了多少？（勾一個）"}
          - {q: stage1.t1.b.result, title: "③ 結果怎樣？（勾一個）"}
      - {type: sentence, q: stage1.t1.b.quote, title: "把三格串起來", multiline: true}
      - type: callout
        text: |
          **還是卡住？** 想像他傳 LINE 跟朋友抱怨，會怎麼打字。照那樣寫。
          他不會分段、不會用成語、可能還有錯字。那樣才對。
      - type: callout
        text: |
          **這裡不用寫數字。**
          具體的金額和時間是很有力的素材（「花了九萬六」比「花了很多錢」有畫面得多），但那個要等任務 2 撿回真的原話，從他嘴裡拿。
      - {type: callout, text: "**這一句任務 2 之後會改。**"}
      - type: details
        summary: 範例（照上面的選項組出來的）
        text: |
          - 我上過課了 ＋ 花了很多錢 ＋ 完全沒有改變
            → **「我上過課了，錢也花了不少，還是完全沒有改變。」**
          - 我請人幫忙過了 ＋ 換過好幾個了 ＋ 我不知道問題在哪
            → **「我換過好幾個了，每一個都說沒問題，我真的不知道問題在哪。」**
  p.t1.b.3:
    title: "1-B　套進句子：我幫他解決的問題"
    sourceRef: {file: 作業, heading: "1-B　我解決什麼問題", step: "步驟 3"}
    blocks:
      - {type: text, q: stage1.t1.b.from, prefix: "從【", suffix: "】"}
      - {type: text, q: stage1.t1.b.to, prefix: "變成【", suffix: "】"}
      - {type: sentence, q: stage1.t1.b.sentence, title: "我的第二句"}
      - {type: check, derived: stage1.t1.b.learn_check}
      - {type: check, derived: stage1.t1.b.learn_hint}
      - type: prose
        text: |
          - *錯誤示範：* 從【不會霧眉】變成【學會霧眉】
          - *正確示範：* 從【學完接不到客人】變成【每個月有穩定的預約】
  p.t1.c.1:
    title: "1-C　先選你的切角"
    sourceRef: {file: 作業, heading: "1-C　為什麼是你", step: "步驟 1"}
    blocks:
      - {type: choice, q: stage1.t1.c.tried}
      - {type: tip, derived: stage1.t1.c.tip}
      - {type: choice, q: stage1.t1.c.angle}
      - type: callout
        text: |
          **什麼時候選 C 結果型？**
          當你在這個領域裡已經是**別人會主動提到的名字**。具體來說，至少要中一項：
      - type: group
        showWhen: {input: stage1.t1.c.angle, equals: C}
        blocks:
          - {type: choice, q: stage1.t1.c.c_eligible}
      - {type: check, derived: stage1.t1.c.c_warn}
      - {type: callout, text: "**三個都沒有？** 選 A。你一定走過那條路，不然你不會在這一行。"}
  p.t1.c.2:
    title: "1-C　照你選的那一個，填對應的句型"
    sourceRef: {file: 作業, heading: "1-C　為什麼是你", step: "步驟 3"}
    blocks:
      - type: group
        showWhen: {input: stage1.t1.c.angle, equals: A}
        blocks:
          - {type: text, q: stage1.t1.c.a1, prefix: "我以前也【", suffix: "】"}
          - {type: text, q: stage1.t1.c.a2, prefix: "後來我【", suffix: "】"}
          - {type: sentence, q: stage1.t1.c.sentence_a, title: "我的第三句"}
      - type: group
        showWhen: {input: stage1.t1.c.angle, equals: B}
        blocks:
          - {type: text, q: stage1.t1.c.b1, prefix: "我有一套【", suffix: "】"}
          - {type: text, q: stage1.t1.c.b2, prefix: "專門解決【", suffix: "】"}
          - {type: sentence, q: stage1.t1.c.sentence_b, title: "我的第三句"}
          - type: callout
            text: |
              **方法還沒有名字？** 現在取一個。
              格式：**【用途】＋【動作】＋【步驟數】**。
              例如：體態重建法、三步驟解題法、接案五步驟。
      - type: group
        showWhen: {input: stage1.t1.c.angle, equals: C}
        blocks:
          - {type: text, q: stage1.t1.c.c1, prefix: "我做過【", suffix: "】"}
          - {type: text, q: stage1.t1.c.c2, prefix: "達成【", suffix: "】"}
          - {type: sentence, q: stage1.t1.c.sentence_c, title: "我的第三句"}
          - {type: callout, text: "**重要：** 這裡只能寫真的發生過的事。寫不出漂亮數字就寫小的，**小的真話比大的假話有用。**"}
      - type: group
        showWhen: {input: stage1.t1.c.angle, empty: true}
        blocks:
          - {type: callout, text: "**三個都沒有？** 選 A。你一定走過那條路，不然你不會在這一行。"}
  p.t1.done:
    title: 任務 1 完成標準
    sourceRef: {file: 作業, heading: "任務 1 完成標準"}
    blocks:
      - {type: readout, derived: stage1.t1.done.all_three, title: "你的三句話"}
      - {type: check, derived: stage1.t1.done.len80}
      - {type: checklist, q: stage1.t1.done.checks, auto: {sentences: stage1.t1.done.all_three, len80: stage1.t1.done.len80}}
      - {type: callout, text: "三個都打勾就往下走。**不用寫到滿意**，階段二會再改一次。"}

  p.t2.lec: {title: 講義 1.2 什麼是商業機會, lectureChapter: "1.2 什麼是商業機會"}
  p.t2.a.1:
    title: "2-A　打開這幾個地方，搜尋這幾組關鍵字"
    sourceRef: {file: 作業, heading: "2-A　蒐集 10 句原話", step: "步驟 1"}
    blocks:
      - {type: choice, q: stage1.t2.a.places}
      - type: callout
        text: |
          **注意：用客人的說法，不是你的專業術語。**
          不是「體適能訓練」是「減肥」；不是「口腔衛教」是「牙齒黃」。
      - type: prose
        text: |
          把【你的行業】換成客人會用的字。

          **找「花過錢但沒解決」的人（最重要，對應你 1-A 勾的 C）：**
          - 【你的行業】+ 沒效果
          - 【你的行業】+ 沒用
          - 【你的行業】+ 浪費錢
          - 【你的行業】+ 後悔

          **找「不知道怎麼選」的人：**
          - 【你的行業】+ 推薦嗎
          - 【你的行業】+ 怎麼選
          - 【你的行業】+ 值得嗎

          **找「卡住很久」的人：**
          - 【你的行業】+ 好難
          - 【你的行業】+ 放棄
          - 【你的行業】+ 一直沒有進步
      - {type: callout, text: "**第一組最值錢。** 那些人已經花過錢了，他們的抱怨最具體，而且他們是最可能再掏一次錢的人。"}
  p.t2.a.2:
    title: "2-A　照抄 10 句"
    sourceRef: {file: 作業, heading: "2-A　蒐集 10 句原話", step: "步驟 3"}
    blocks:
      - {type: callout, text: "**規則：原文照抄，一個字都不要改。**\n你一改寫，就變成你的想法，不是他的痛苦了。", tone: warn}
      - {type: table, table: stage1.t2.a.quotes}
      - type: callout
        text: |
          **找不到 10 句？** 那是很重要的訊號，代表這群人可能沒有在公開場合抱怨，或者這個痛不夠痛。
          先換一組關鍵字再試一次；還是找不到，就回去改任務 1 的對象。
  p.t2.a.3:
    title: "2-A　圈出重複最多次的抱怨"
    sourceRef: {file: 作業, heading: "2-A　蒐集 10 句原話", step: "步驟 4"}
    blocks:
      - {type: text, q: stage1.t2.a.top, chipsFromTable: {table: stage1.t2.a.quotes, column: text}, chipsLabel: "從上面 10 句挑一句"}
      - {type: number, q: stage1.t2.a.top_count, unit: 次}
      - {type: callout, text: "**這句話，就是你之後所有廣告文案的起點。** 先把它記起來。"}
  p.t2.b:
    title: "2-B　找出 3 個正在花錢的競爭者"
    sourceRef: {file: 作業, heading: "2-B　找出 3 個正在花錢的競爭者"}
    blocks:
      - type: prose
        text: |
          網址：`facebook.com/ads/library`

          1. 「地區」選 **台灣**
          2. 「廣告類別」選 **所有廣告**
          3. 搜尋欄輸入你的行業關鍵字
          4. 按 Enter

          | 刊登多久 | 代表什麼 |
          |---|---|
          | 不到 1 週 | 剛開始測，還看不出來 |
          | **超過 1 個月** | **幾乎確定有賺錢**（沒人會拿錢燒興趣） |
          | 超過 3 個月 | 這是他的主力，值得研究 |
      - {type: table, table: stage1.t2.b.rows}
      - type: callout
        text: |
          **一個都找不到？** 這通常不是好消息，而是代表這個市場沒有人在付費買。
          請回去把任務 1 的對象放大一點再查一次。還是找不到，看 2-E 的 E 項。
  p.t2.c:
    title: "2-C　找出現有解法的 3 個破口"
    sourceRef: {file: 作業, heading: "2-C　找出現有解法的 3 個破口"}
    blocks:
      - type: prose
        text: |
          - 競爭者貼文底下的留言
          - 課程平台的 3 星以下評價
          - 社團搜尋「上完課」「才發現」「早知道」
      - {type: table, table: stage1.t2.c.rows}
      - type: details
        summary: 範例
        text: "第 1 列：只教技術，沒教怎麼找客人 → 我把接單流程當成主課，技術只是配套"
        origin: authored
  p.t2.d:
    title: "2-D　檢查一下你有沒有真的去查"
    sourceRef: {file: 作業, heading: "2-D　檢查一下你有沒有真的去查"}
    blocks:
      - {type: callout, text: "**這不是在打分數，是在確認你用的是「查到的」，不是「想的」。**"}
      - {type: likert, items: [stage1.t2.d.q1, stage1.t2.d.q2, stage1.t2.d.q3]}
      - type: group
        showWhen: {input: stage1.t2.d.q1, equals: short}
        blocks:
          - type: callout
            text: |
              **① 原話不到 10 句**
              先換一組關鍵字再試一次。還是找不到，回去改任務 1 的服務對象——這通常代表那群人不會在公開場合抱怨，或是這個痛不夠痛。
      - type: group
        showWhen: {input: stage1.t2.d.q1, equals: altered}
        blocks:
          - type: callout
            text: |
              **② 原話是改寫過的**
              回去把原文貼回來。一個字都不要改。
              你改寫的版本是**你的想法**，不是他的痛苦——而你之後每一篇文案，都要從他的痛苦長出來。
      - type: group
        showWhen: {input: stage1.t2.d.q2, equals: short}
        blocks:
          - type: callout
            text: |
              **③ 競爭者不到 3 個**
              把任務 1 的對象放大一點（例如從「霧眉師」放大到「美業工作者」）再查一次。
              放大之後還是找不到，這是很重要的訊號：**這個市場可能真的沒有人在付費買。**
      - type: group
        showWhen: {input: stage1.t2.d.q2, equals: altered}
        blocks:
          - type: callout
            text: |
              **④ 沒查刊登日期**
              回去查。這一欄是三題裡最關鍵的——它是唯一能證明「有人真的在這裡賺到錢」的東西。
              沒有它，你只知道有人在賣，不知道有沒有人在買。
      - type: group
        showWhen: {input: stage1.t2.d.q3, equals: altered}
        blocks:
          - type: callout
            text: |
              **⑤ 破口是自己推測的**
              「我覺得他們大概沒有教到接案」——這是猜的。
              回去找真的有人寫出來的抱怨。猜出來的破口，做出來的產品也是猜的。
      - type: group
        showWhen: {inputs: [stage1.t2.d.q1, stage1.t2.d.q2, stage1.t2.d.q3], allEqual: yes}
        blocks:
          - {type: callout, text: "**三題都勾「有」，任務 2 就完成了。**", tone: ok}
      - type: callout
        text: |
          **真正判斷「這個位置能不能站」，是階段二的事。**
          那裡會把三個競品攤開來比，看有沒有一句話是三家都沒講過的。
          講得出來，你就有位置；講不出來，那時候才是真的該停下來。
  p.t2.e:
    title: "2-E　查完之後，回頭看一眼任務 1"
    sourceRef: {file: 作業, heading: "2-E　查完之後，回頭看一眼任務 1"}
    blocks:
      - type: prose
        text: |
          **大部分人做完任務 2 會發現一件事：查到的東西，跟自己原本想的不太一樣。**
          這很正常，而且是好事。
          **先講清楚：這一題不是要你重新考慮要不要做。**
          所以這裡只有一個問題：**要調整哪一格？**
      - {type: choice, q: stage1.t2.e.outcome}
      - type: group
        showWhen: {input: stage1.t2.e.outcome, includes: E}
        blocks:
          - type: prose
            text: |
              **先不要下結論說這個市場沒錢。** 實務上遇到這種狀況，絕大多數是同一個原因：**你腦袋裡的講法，跟市場上實際在用的講法對不上。**
              先自己試一次這三件事：
              1. **換成客人會用的字**，不是同行會用的字
              2. **換成他的處境，不是你的技術**
              3. **去搜尋你這一行客人在抱怨的那件事**，看誰在下面留言、誰在下面投廣告
              **三種都試過還是查不到，就到這裡停手，不要自己硬猜。**
          - type: callout
            text: |
              **如果三種搜尋方式都試過仍查不到，以下三格是選填的求助資訊：**
              它們不會阻擋任務提交；如果你卡住了，建議填寫後再用官方 LINE 私訊我，方便一起找出你的專業說法和市場用語之間的落差。
          - {type: text, q: stage1.t2.e.help_keywords}
          - {type: text, q: stage1.t2.e.help_range}
          - {type: text, q: stage1.t2.e.help_discovery}
      - type: callout
        text: |
          **最後一句：**
          這一題填 B、C、D 都很正常，大部分人都會中一個。
          查完發現跟想的不一樣，代表這 90 分鐘有用。
          **真正糟糕的情況不是「查出來跟我想的不同」，是「沒查就往下走」。**

  p.t3.lec: {title: 講義 1.3 什麼是商業模式, lectureChapter: "1.3 什麼是商業模式"}
  p.t3.a.1:
    title: "3-A　四格現況表（流量、篩選）"
    sourceRef: {file: 作業, heading: "3-A　四格現況表"}
    blocks:
      - {type: callout, text: "這個任務不是要你變厲害，是要你誠實。**空白的格子，就寫「目前沒有」。**"}
      - {type: choice, q: stage1.t3.a.flow}
      - {type: text, q: stage1.t3.a.flow_text, prefix: "我的客人主要來自"}
      - {type: choice, q: stage1.t3.a.screen}
      - {type: text, q: stage1.t3.a.screen_text, prefix: "我篩選客人的方式是"}
      - type: callout
        text: |
          **提醒：「心裡有數」不算。**
          篩選要成立，必須是**客人在跟你講到話之前，就自己看得到、也走得掉。**
          寫在你腦袋裡的標準，只會變成你在對談時的為難。
  p.t3.a.2:
    title: "3-A　四格現況表（成交、交付）"
    sourceRef: {file: 作業, heading: "3-A　四格現況表"}
    blocks:
      - {type: choice, q: stage1.t3.a.close}
      - {type: text, q: stage1.t3.a.close_text, prefix: "我成交的方式是"}
      - type: callout
        text: |
          **提醒：「報價」不算成交流程。**
          成交要成立，你得答得出：**從對方開口到他付錢，中間會發生哪些事，順序是什麼。**
      - {type: choice, q: stage1.t3.a.deliver}
      - {type: text, q: stage1.t3.a.deliver_text, prefix: "我交付的是"}
  p.t3.b:
    title: "3-B　追客 or 篩客？自我檢測"
    sourceRef: {file: 作業, heading: "3-B　追客 or 篩客？自我檢測"}
    blocks:
      - {type: prose, text: "每一題誠實回答，選「是」得 1 分："}
      - {type: likert, items: [stage1.t3.b.s1, stage1.t3.b.s2, stage1.t3.b.s3, stage1.t3.b.s4, stage1.t3.b.s5, stage1.t3.b.s6]}
      - {type: score, value: stage1.t3.b.score, label: stage1.t3.b.verdict, detail: stage1.t3.b.detail, total: 6}
      - {type: check, derived: stage1.t3.b.score_left}
      - {type: callout, text: "**分數高不是壞事。這是起點，不是判決。**"}
  p.t3.c:
    title: "3-C　找出你的破口"
    sourceRef: {file: 作業, heading: "3-C　找出你的破口"}
    blocks:
      - {type: readout, derived: stage1.t3.c.gaps, title: "依你的勾選判斷，目前缺的格子"}
      - {type: callout, text: "這是依你在 3-A 的勾選自動判斷的，只是提醒。你覺得不準，可以直接在下面選你自己的判斷。", origin: authored}
      - type: prose
        text: |
          | 空的格子 | 要去補的階段 |
          |---|---|
          | 流量 | 階段四（Meta 廣告） |
          | 篩選 | 階段五（銷售頁 + 官方 LINE） |
          | 成交 | 階段六（銷售流程） |
          | 交付 | 階段二（產品與定位） |
      - {type: choice, q: stage1.t3.c.priority}
      - type: callout
        text: |
          **如果不確定選哪個，從上往下看，第一個很難看的那一關就是要修的地方：**
          1. 廣告有沒有人點？→ 沒有，補流量
          2. 點了有沒有人聯繫？→ 沒有，補篩選
          3. 談了有沒有成交？→ 沒有，補成交
          4. 都有但生意還是吃力？→ 補產品與定位
          **不要跳過前面的去修後面的。前面漏水，後面修得再好也沒用。**
  p.t3.done:
    title: 任務 3 完成標準
    sourceRef: {file: 作業, heading: "任務 3 完成標準"}
    blocks:
      - {type: checklist, q: stage1.t3.done.checks, auto: {boxes: stage1.t3.done.boxes_ok, score: stage1.t3.b.score, priority: stage1.t3.done.priority_ok}}

  p.t4.lec: {title: 講義 1.4 三步驟的獲客招生模式, lectureChapter: "1.4 三步驟的獲客招生模式"}
  p.t4.a:
    title: "4-A　C｜我要用廣告找到的人"
    sourceRef: {file: 作業, heading: "4-A　C｜我要用廣告找到的人"}
    blocks:
      - {type: sentence, q: stage1.t4.a.identity_copy, title: "直接抄任務 1-A 的答案"}
      - {type: number, q: stage1.t4.a.age_from, unit: 歲起}
      - {type: number, q: stage1.t4.a.age_to, unit: 歲止}
      - {type: choice, q: stage1.t4.a.region}
      - {type: choice, q: stage1.t4.a.gender}
      - {type: text, q: stage1.t4.a.layer}
      - type: callout
        text: |
          **如果你的客人還有其他重要的分層，這裡自己加一條。**
          例如：孩子的年級、開業多久、有沒有基礎。
          同一群人但處境不同的話，文案要分開寫，不能一篇打所有人。
  p.t4.b.1:
    title: "4-B　測試一：他要的東西，跟我信的東西衝突嗎？"
    sourceRef: {file: 作業, heading: "4-B　A｜我的銷售頁要篩掉的人"}
    blocks:
      - type: callout
        text: |
          **這是整本手冊最重要的一題。**
          這種人不是付不出錢，是**收了會出事**。
      - {type: likert, items: [stage1.t4.b.f1, stage1.t4.b.f2, stage1.t4.b.f3], title: "想一下你實際遇過的人，各勾一個頻率"}
      - {type: tip, derived: stage1.t4.b.tip}
      - {type: choice, q: stage1.t4.b.block}
      - {type: callout, text: "**勾不出來？** 就勾第一個。「要我保證結果」是最多人踩、後果也最嚴重的一種。"}
  p.t4.b.2:
    title: "4-B　測試二：我交付的東西，能滿足他要的嗎？"
    sourceRef: {file: 作業, heading: "4-B　A｜我的銷售頁要篩掉的人"}
    blocks:
      - {type: callout, text: "這種人**不是壞人，只是我幫不上**。硬收就是把自己的招牌賠進去。"}
      - type: prose
        text: |
          | 他要的是 | 這家給的是 | 對得上嗎 |
          |---|---|---|
          | 想學怎麼煮一桌年菜 | 這家只教基礎刀工 | ✗ |
          | 想減 20 公斤 | 這家教的是體態訓練，不處理飲食 | ✗ |
          | 想快速拿到證照 | 這家從頭教到會，要上滿一年 | ✗ |
          | 想找人幫他顧小孩 | 這家教的是爸媽怎麼帶小孩 | ✗ |
      - {type: choice, q: stage1.t4.b.mismatch}
      - type: callout
        text: |
          **最後一項要特別看。**
          如果你的生意是「付錢的人」和「使用的人」不是同一個（家長和孩子、老闆和員工、飼主和寵物），這一項你幾乎一定要勾。
  p.t4.b.3:
    title: "4-B　用一句話收尾"
    sourceRef: {file: 作業, heading: "4-B　A｜我的銷售頁要篩掉的人", step: "步驟 3"}
    blocks:
      - {type: sentence, q: stage1.t4.b.no_sentence, title: "我不收＿＿的人", multiline: true, prefix: "我不收", suffix: "的人。"}
      - {type: callout, text: "**唸一次給自己聽。唸得出來，這一題就過了。**"}
      - type: callout
        text: |
          **覺得這樣會不會太兇？** 不會。
          把不對的人擋在外面，是在保護你之後每一場對談的時間。
          而且一個誰都適合的頁面，讀的人不會覺得「這是為我做的」。
      - {type: callout, text: "這句話到了階段五，會變成你銷售頁上真正的一段文案——那時候你有定位、有畫像、有價格，寫出來的版本會比現在好很多。"}
  p.t4.c:
    title: "4-C　S｜對談時我要確認的三件事"
    sourceRef: {file: 作業, heading: "4-C　S｜對談時我要確認的三件事"}
    blocks:
      - {type: choice, q: stage1.t4.c.picks}
      - {type: sentence, q: stage1.t4.c.q1, title: "第 1 題"}
      - {type: sentence, q: stage1.t4.c.q2, title: "第 2 題"}
      - {type: sentence, q: stage1.t4.c.q3, title: "第 3 題"}
      - {type: callout, text: "階段六會給你完整的【WIN 對談模型】。現在先有三題就夠了。"}
  p.t4.d:
    title: "4-D　串成一段話"
    sourceRef: {file: 作業, heading: "4-D　串成一段話"}
    blocks:
      - {type: sentence, q: stage1.t4.d.p1, title: "我要用廣告找到"}
      - {type: sentence, q: stage1.t4.d.p2, title: "用銷售頁把＿＿篩掉"}
      - {type: sentence, q: stage1.t4.d.p3, title: "剩下的人加我 LINE 之後，我會先問他"}
      - {type: readout, derived: stage1.t4.d.paragraph, title: "串起來"}
      - {type: callout, text: "**唸得順嗎？** 唸不順就代表哪裡還沒想清楚，回去改那一格。"}
  p.t4.done:
    title: 任務 4 完成標準
    sourceRef: {file: 作業, heading: "任務 4 完成標準"}
    blocks:
      - {type: checklist, q: stage1.t4.done.checks, auto: {three: stage1.t4.done.three_ok, b_both: stage1.t4.done.b_ok}}

  p.t5.lec: {title: 講義 1.5 獲客招生模式的執行, lectureChapter: "1.5 獲客招生模式的執行"}
  p.t5.a:
    title: "5-A／5-B　先訂上線日，四週任務表"
    sourceRef: {file: 作業, heading: "5-A　先訂上線日"}
    blocks:
      - {type: date, q: stage1.t5.a.today}
      - {type: date, q: stage1.t5.a.launch, defaultFrom: stage1.t5.a.launch_default}
      - {type: checklist, q: stage1.t5.a.in_calendar}
      - {type: callout, text: "**重要：這一天不是「準備好的那一天」，是「不管做到什麼程度都要上線的那一天」。**", tone: warn}
      - type: schedule
        start: stage1.t5.a.today
        end: stage1.t5.a.launch_eff
        done: stage1.t5.b.done
        weeks:
          - {id: w1, label: 第 1 週, derived: stage1.t5.b.w1, what: 定位＋受眾（階段二）, output: 一句定位、一份用戶畫像}
          - {id: w2, label: 第 2 週, derived: stage1.t5.b.w2, what: 文案＋廣告圖（階段三）, output: 3 版文案、3 張圖}
          - {id: w3, label: 第 3 週, derived: stage1.t5.b.w3, what: 銷售頁＋官方 LINE（階段五）, output: 頁面上線、LINE 開通}
          - {id: w4, label: 第 4 週, derived: stage1.t5.b.w4, what: 廣告上線＋開始對談（階段四、六）, output: 第一批真實數據}
  p.t5.c:
    title: "5-C　上線前的 60 分檢查"
    sourceRef: {file: 作業, heading: "5-C　上線前的 60 分檢查"}
    blocks:
      - {type: checklist, q: stage1.t5.c.checks}
      - type: callout
        text: |
          三個都打勾＝60 分。**60 分就上線。**
          剩下的 40 分，讓數據告訴你要補哪裡，不要自己猜。
          **第二條最難自己檢查**，因為兩邊都是你自己寫的，你會覺得「這不是同一件事嗎」。
          做法是：**把廣告的第一句和銷售頁的第一句貼在一起看。** 貼在一起還順，才算過。
  p.t5.d:
    title: "5-D　上線後的數字紀錄表"
    sourceRef: {file: 作業, heading: "5-D　上線後的數字紀錄表"}
    blocks:
      - {type: prose, text: "上線後每週填一次。"}
      - {type: callout, text: "這一頁可以之後再回來填。", origin: authored}
      - {type: tableDynamic, table: stage1.t5.d.rows, extra: stage1.t5.d.extra}
      - type: callout
        text: |
          **如果你的流程中間多一關，就自己加一欄。**
          例如：有免費試聽的人，要多「預約試聽數」和「試聽出席數」兩欄。
      - type: prose
        text: |
          從上往下看，第一個數字很難看的那一關，就是你要修的地方。

          | 哪個數字爛 | 回去修哪裡 |
          |---|---|
          | 點擊率低 | 廣告的鉤子跟圖（階段三、四） |
          | 有點擊，但沒人加 LINE | 銷售頁（階段五） |
          | 有加 LINE，但沒成交 | 對談腳本（階段六） |

          **一次只修一關。** 三關一起改，你永遠不會知道是什麼在起作用。
      - {type: callout, text: "**數字看關卡，對談看人。**"}
  p.t5.done:
    title: 任務 5 完成標準
    sourceRef: {file: 作業, heading: "任務 5 完成標準"}
    blocks:
      - {type: checklist, q: stage1.t5.done.checks, auto: {calendar: stage1.t5.done.cal_ok, dates: stage1.t5.b.w1}}

  p.app.bp:
    title: 我的第一版系統藍圖
    sourceRef: {file: 作業, heading: "上半頁｜我的第一版系統藍圖"}
    blocks: [{type: blueprint}]
  p.app.handoff:
    title: 我要帶去階段二的東西
    sourceRef: {file: 作業, heading: "下半頁｜我要帶去階段二的東西"}
    blocks:
      - {type: prose, text: "階段二不會從頭開始，它會直接拿你這幾樣東西往下做。"}
      - {type: checklist, q: stage1.app.handoff, auto: {h1: stage1.app.h1_ok, h2: stage1.app.h2_ok, h3: stage1.app.h3_ok, h4: stage1.app.h4_ok}}
      - {type: callout, text: "**四項都打勾，就可以進階段二了。**\n**其中第一項最關鍵。** 原話撿得夠不夠、是不是照抄的，決定的不是階段一的分數，是你在階段二有沒有材料可以用。"}
  p.app.close:
    title: 最後一件事
    sourceRef: {file: 作業, heading: "最後一件事"}
    blocks:
      - type: prose
        text: |
          回頭看你剛剛填完的這幾頁。
          三小時前，你可能還說不清楚自己在賣什麼、賣給誰。
          現在你有一張地圖了。
          它不完美，很多格子還寫著「暫定」。**這樣就對了。**
          **階段二幾乎一定會改掉你現在寫的東西。**
          這不是白做。沒有第一版，你到了階段二只會面對一張空白的表格，然後又卡住一次。
          有了第一版，你在階段二做的是**修正**——而修正永遠比從零開始快。
          接下來的每一個階段，都是回來把其中一格改好。
  p.app.lec: {title: 講義 1.6 階段一總結, lectureChapter: "1.6 階段一總結"}

flows:
  self_study:
    label: 自學版（正式版順序）
    parts:
      - {label: 開場, pages: [p.open.1, p.open.2, p.open.lec]}
      - {label: 任務1 三句話, pages: [p.t1.lec, p.t1.a.1, p.t1.a.2, p.t1.b.1, p.t1.b.2, p.t1.b.3, p.t1.c.1, p.t1.c.2, p.t1.done]}
      - {label: 任務2 查證, pages: [p.t2.lec, p.t2.a.1, p.t2.a.2, p.t2.a.3, p.t2.b, p.t2.c, p.t2.d, p.t2.e]}
      - {label: 任務3 現況, pages: [p.t3.lec, p.t3.a.1, p.t3.a.2, p.t3.b, p.t3.c, p.t3.done]}
      - {label: 任務4 CAS, pages: [p.t4.lec, p.t4.a, p.t4.b.1, p.t4.b.2, p.t4.b.3, p.t4.c, p.t4.d, p.t4.done]}
      - {label: 任務5 上線, pages: [p.t5.lec, p.t5.a, p.t5.c, p.t5.d, p.t5.done]}
      - {label: 附錄 藍圖, pages: [p.app.bp, p.app.handoff, p.app.close, p.app.lec]}
  consult_session:
    label: 諮詢對談版（Artifact 順序）
    parts:
      - {label: 開場, pages: [p.open.1, p.open.2]}
      - {label: 現況, pages: [p.t3.a.1, p.t3.a.2, p.t3.b, p.t3.c]}
      - {label: 三句話, pages: [p.t1.a.1, p.t1.a.2, p.t1.b.1, p.t1.b.2, p.t1.b.3, p.t1.c.1, p.t1.c.2, p.t1.done]}
