      - {label: 上線日, pages: [p.t5.a]}
      - {label: 回家作業, pages: [p.t2.a.1, p.t2.a.2, p.t2.a.3, p.t2.b, p.t2.c, p.t2.d, p.t2.e, p.t5.c, p.t5.d]}
      - {label: 藍圖, pages: [p.app.bp, p.app.handoff]}

