# 階段一 Flow 設計檔（sidecar）。教材原文在同資料夾的兩份 .md，本檔不改動它們（R-1、H3）。
# 所有給學員看的文字都複製自原文；不是原文的一律標 origin: authored（見 docs/flow/FLOW_SPEC.md）。
schemaVersion: 1
stage: stage-01
title: 階段一：獲客招生的商業模式
tasks: {open: stage-01-1, t1: stage-01-1, t2: stage-01-2, t3: stage-01-3, t4: stage-01-4, t5: stage-01-5, app: stage-01-附錄}

questions:
  # ---- 開場 -------------------------------------------------------------
  stage1.open.name: {kind: text, label: "你的名字", placeholder: "藍圖上會印出來", optional: true, origin: authored}

  # ---- 任務 1｜1-A ------------------------------------------------------
  stage1.t1.a.stage:
    kind: single
    label: "步驟 1：他跟這個問題的關係走到哪一步了"
    legacyKeys: [stage-01-1-answer-0]
    sourceRef: {file: 作業, heading: "1-A　我服務誰"}
    options:
      - {id: A, label: "A. 還沒動作", hint: "他覺得困擾，但還沒真的做什麼。也可能覺得「再看看」「還沒那麼嚴重」。"}
      - {id: B, label: "B. 自己想辦法", hint: "查資料、看免費教學、問朋友、自己摸索。花的是時間，還沒花錢。"}
      - {id: C, label: "C. 花過錢找別人解決，但沒解決", hint: "已經付錢給別人試過了（買過課、請過人、買過服務），但沒得到他要的結果。"}
      - {id: D, label: "D. 已經有結果，想要更好", hint: "現在的狀況還可以，只是想再往上一階。"}
  stage1.t1.a.money:
    kind: single
    label: "這件事本身，有在幫他賺錢嗎？"
    legacyKeys: [stage-01-1-answer-1]
    sourceRef: {file: 作業, heading: "1-A　我服務誰"}
    options:
      - {id: yes, label: "有", hint: "他靠這個接案、開店、有營收在跑"}
      - {id: no, label: "沒有", hint: "這是他的興趣、需求、或個人問題"}
  stage1.t1.a.identity:
    kind: text
    label: "寫出被服務的身分（一個名詞就好）"
    legacyKeys: [stage-01-1-answer-2]
    sourceRef: {file: 作業, heading: "1-A　我服務誰"}
  stage1.t1.a.state:
    kind: text
    label: "題目 1 的狀態"
    hint: "用一句話寫出他現在的狀態（步驟 1 勾的那一格）"
    origin: authored
    sourceRef: {file: 作業, heading: "1-A　我服務誰"}
  stage1.t1.a.sentence:
    kind: text
    label: "把上面兩格套進句子"
    derived: stage1.t1.a.sentence_auto
    legacyKeys: [stage-01-1-answer-3]
    sourceRef: {file: 作業, heading: "1-A　我服務誰"}

  # ---- 1-B --------------------------------------------------------------
  stage1.t1.b.type:
    kind: single
    label: "勾選他半夜睡不著時，在想的那件事（只能勾一個）"
    legacyKeys: [stage-01-1-answer-4]
    sourceRef: {file: 作業, heading: "1-B　我解決什麼問題"}
    options:
      - {id: tried_no_effect, label: "① 我試過了，但沒效果", hint: "他做過努力，結果不如預期。（請過教練沒瘦、補了一年沒進步、上過課還是接不到客人）"}
      - {id: dont_know_where, label: "② 我不知道問題出在哪", hint: "他知道不對勁，但找不到原因，所以不知道從哪裡下手。（孩子很認真但就是考不好、明明有在運動但體態沒變）"}
      - {id: cannot_do, label: "③ 我知道該做什麼，但做不到", hint: "方法他都懂，就是執行不下去、撐不久、堅持不了。（知道要少吃多動、知道該每天練習、知道該發文）"}
      - {id: dont_know_start, label: "④ 我不知道從哪裡開始", hint: "資訊太多、選項太多，他被卡在第一步。（想學但不知道學什麼、想投資但不敢下單）"}
      - {id: too_painful, label: "⑤ 我做得到，但太痛苦了", hint: "他有在做，也有結果，但過程消耗太大，撐不下去。（每天陪寫功課陪到吵架、每個月靠硬撐才有業績）"}
  stage1.t1.b.did:
    kind: single
    label: "① 他做過什麼？（勾一個）"
    legacyKeys: [stage-01-1-answer-5]
    legacyOtherKey: stage-01-1-answer-6
    sourceRef: {file: 作業, heading: "1-B　我解決什麼問題"}
    options:
      - {id: tried, label: "我試過了"}
      - {id: asked_help, label: "我請人／找人幫忙過了"}
      - {id: studied, label: "我上過課／學過了"}
      - {id: bought, label: "我買過了"}
      - {id: worked_hard, label: "我很努力了"}
      - {id: followed, label: "我都有照做"}
      - {id: other, label: "其他", other: true}
  stage1.t1.b.invest:
    kind: single
    label: "② 投入了多少？（勾一個）"
    legacyKeys: [stage-01-1-answer-7]
    sourceRef: {file: 作業, heading: "1-B　我解決什麼問題"}
    options:
      - {id: money, label: "花了很多錢"}
      - {id: time, label: "花了很多時間"}
      - {id: switched, label: "換過好幾個了"}
      - {id: both, label: "錢和時間都花了不少"}
  stage1.t1.b.result:
    kind: single
    label: "③ 結果怎樣？（勾一個）"
    legacyKeys: [stage-01-1-answer-8]
    legacyOtherKey: stage-01-1-answer-9
    sourceRef: {file: 作業, heading: "1-B　我解決什麼問題"}
    options:
      - {id: no_change, label: "完全沒有改變"}
      - {id: little, label: "有一點，但不夠"}
      - {id: relapsed, label: "一開始有，後來又回去了"}
      - {id: dont_know_where, label: "我不知道問題在哪"}
      - {id: dont_know_next, label: "我不知道下一步該做什麼"}
      - {id: cant_hold, label: "我快撐不下去了"}
      - {id: other, label: "其他", other: true}
  stage1.t1.b.quote:
    kind: textarea
    label: "把三格串起來"
    hint: "句型：①＋②＋③，中間加「，」或「但」。"
    derived: stage1.t1.b.quote_auto
    legacyKeys: [stage-01-1-answer-10]
    sourceRef: {file: 作業, heading: "1-B　我解決什麼問題"}
  stage1.t1.b.from: {kind: text, label: "現在的狀況", legacyKeys: [], sourceRef: {file: 作業, heading: "1-B　我解決什麼問題"}}
  stage1.t1.b.to: {kind: text, label: "他想要的樣子", legacyKeys: [], sourceRef: {file: 作業, heading: "1-B　我解決什麼問題"}}
  stage1.t1.b.sentence:
    kind: text
    label: "步驟 3：套進句子"
    derived: stage1.t1.b.sentence_auto
    legacyKeys: [stage-01-1-answer-11]
    sourceRef: {file: 作業, heading: "1-B　我解決什麼問題"}

  # ---- 1-C --------------------------------------------------------------
  stage1.t1.c.tried:
    kind: single
    label: "你的客人在找上你之前，通常已經試過別家了嗎？"
    legacyKeys: [stage-01-1-answer-12]
    sourceRef: {file: 作業, heading: "1-C　為什麼是你"}
    options:
      - {id: no, label: "沒有。", hint: "他第一次認真找這類服務，大概還在自己想辦法"}
      - {id: yes, label: "有。", hint: "他找過、比較過，甚至已經付錢買過類似的東西"}
  stage1.t1.c.angle:
    kind: single
    label: "選你的切角"
    legacyKeys: [stage-01-1-answer-13]
    sourceRef: {file: 作業, heading: "1-C　為什麼是你"}
    options:
      - {id: A, label: "A 經歷型", hint: "我也走過同一條路"}
      - {id: B, label: "B 方法型", hint: "我有一套別人沒有的做法"}
      - {id: C, label: "C 結果型", hint: "我做出過具體成果"}
  stage1.t1.c.c_eligible:
    origin: authored
    kind: multi
    label: "C 結果型的資格（至少要中一項）"
    optional: true
    sourceRef: {file: 作業, heading: "1-C　為什麼是你"}
    options:
      - {id: peers, label: "同行介紹這個領域的時候，會提到你或你的品牌"}
      - {id: heard, label: "你的客人來找你之前，就已經聽過你"}
      - {id: public, label: "你有一個公開、查得到、而且規模明顯的成果"}
  stage1.t1.c.a1: {kind: text, label: "和他一樣的狀況", sourceRef: {file: 作業, heading: "1-C　為什麼是你"}}
  stage1.t1.c.a2: {kind: text, label: "做了什麼改變", sourceRef: {file: 作業, heading: "1-C　為什麼是你"}}
  stage1.t1.c.b1: {kind: text, label: "方法名稱", sourceRef: {file: 作業, heading: "1-C　為什麼是你"}}
  stage1.t1.c.b2: {kind: text, label: "什麼問題", sourceRef: {file: 作業, heading: "1-C　為什麼是你"}}
  stage1.t1.c.c1: {kind: text, label: "具體的事", sourceRef: {file: 作業, heading: "1-C　為什麼是你"}}
  stage1.t1.c.c2: {kind: text, label: "具體的數字或結果", sourceRef: {file: 作業, heading: "1-C　為什麼是你"}}
  stage1.t1.c.sentence_a: {kind: text, label: "如果你選 A（經歷型）", derived: stage1.t1.c.sentence_a_auto, legacyKeys: [stage-01-1-answer-14], sourceRef: {file: 作業, heading: "1-C　為什麼是你"}}
  stage1.t1.c.sentence_b: {kind: text, label: "如果你選 B（方法型）", derived: stage1.t1.c.sentence_b_auto, legacyKeys: [stage-01-1-answer-15], sourceRef: {file: 作業, heading: "1-C　為什麼是你"}}
  stage1.t1.c.sentence_c: {kind: text, label: "如果你選 C（結果型）", derived: stage1.t1.c.sentence_c_auto, legacyKeys: [stage-01-1-answer-16], sourceRef: {file: 作業, heading: "1-C　為什麼是你"}}
  stage1.t1.done.checks:
    kind: multi
    label: "任務 1 完成標準"
    legacyKeys: [stage-01-1-answer-17]
    sourceRef: {file: 作業, heading: "任務 1 完成標準"}
    options:
      - {id: sentences, label: "1-A、1-B、1-C 各有一句完整的話"}
      - {id: len80, label: "三句話加起來不超過 80 個字"}
      - {id: readout, label: "唸出來不會卡卡的"}

  # ---- 任務 2 -----------------------------------------------------------
  stage1.t2.a.places:
    kind: multi
    label: "打開這幾個地方（挑 2 個就好）"
    max: 2
    optional: true
    sourceRef: {file: 作業, heading: "2-A　蒐集 10 句原話"}
    options:
      - {id: fb, label: "Facebook 社團（搜尋你的行業關鍵字，加入 2 到 3 個社團）"}
      - {id: threads, label: "Threads 或 Instagram（搜尋關鍵字）"}
      - {id: dcard, label: "Dcard 相關看板"}
      - {id: youtube, label: "YouTube 上同行影片的留言區"}
      - {id: shopee, label: "蝦皮／課程平台上，同類服務的評價區"}
  stage1.t2.a.top: {kind: text, label: "出現最多次的那一句是", legacyKeys: [stage-01-2-answer-20], sourceRef: {file: 作業, heading: "2-A　蒐集 10 句原話"}}
  stage1.t2.a.top_count: {kind: number, label: "它出現了幾次", legacyKeys: [stage-01-2-answer-21], legacyParse: n1, sourceRef: {file: 作業, heading: "2-A　蒐集 10 句原話"}, origin: authored}
  stage1.t2.d.q1:
    kind: single
    label: "10 句原話，而且是照抄的"
    hint: "你手上有嗎"
    legacyKeys: [stage-01-2-answer-37]
    sourceRef: {file: 作業, heading: "2-D　檢查一下你有沒有真的去查"}
    options: [{id: yes, label: "有"}, {id: short, label: "不到 10 句"}, {id: altered, label: "有，但我改寫過"}]
  stage1.t2.d.q2:
    kind: single
    label: "3 個競爭者，而且都投廣告超過 1 個月"
    hint: "你手上有嗎"
    legacyKeys: [stage-01-2-answer-38]
    sourceRef: {file: 作業, heading: "2-D　檢查一下你有沒有真的去查"}
    options: [{id: yes, label: "有"}, {id: short, label: "不到 3 個"}, {id: altered, label: "有，但我沒查刊登日期"}]
  stage1.t2.d.q3:
    kind: single
    label: "3 個破口，而且是從負評或抱怨裡看到的"
    hint: "你手上有嗎"
    legacyKeys: [stage-01-2-answer-39]
    sourceRef: {file: 作業, heading: "2-D　檢查一下你有沒有真的去查"}
    options: [{id: yes, label: "有"}, {id: short, label: "不到 3 個"}, {id: altered, label: "有，但是我自己推測的"}]
  stage1.t2.e.outcome:
    kind: multi
    label: "勾出你查完之後的狀況（可複選）"
    legacyKeys: [stage-01-2-answer-40]
    sourceRef: {file: 作業, heading: "2-E　查完之後，回頭看一眼任務 1"}
    options:
      - {id: A, label: "A. 跟我想的差不多", hint: "很好，往下走。"}
      - {id: B, label: "B. 他們在痛的，跟我以為的不一樣", hint: "例如：你以為他們卡在「不會做」，結果原話幾乎都在講「做了沒人看」。要改的是任務 1-B（你解決什麼問題），不是換受眾。人沒選錯，是你對他的痛猜錯了。把 1-B 改成原話裡出現最多次的那一個。"}
      - {id: C, label: "C. 競爭者在賣的，跟我想賣的不一樣", hint: "例如：你想教技術，但投廣告投最久的三家都在教接案。這通常不是壞消息。 那代表市場已經幫你驗證過「哪個方向的人願意付錢」。先別急著跟進，也別急著堅持——階段二會把三家攤開來比，那時候再決定你要站哪裡。"}
      - {id: D, label: "D. 原話裡有一種人反覆出現，但不是我原本設定的那種", hint: "例如：你設定的是國三生家長，但抱怨最多的是國一剛升上來的家長。把這件事記下來，帶到階段二。 做用戶畫像的時候會用到。現在不用改任務 1，但你已經多了一個選項。"}
      - {id: E, label: "E. 競爭者一個都找不到", hint: "這一項要認真看，往下看說明。"}
  stage1.t2.e.help_keywords: {kind: text, label: "我查的關鍵字是（選填）", optional: true, legacyKeys: [stage-01-2-answer-41], sourceRef: {file: 作業, heading: "2-E　查完之後，回頭看一眼任務 1"}, origin: authored}
  stage1.t2.e.help_range: {kind: text, label: "我放大過的範圍是（選填）", optional: true, legacyKeys: [stage-01-2-answer-42], sourceRef: {file: 作業, heading: "2-E　查完之後，回頭看一眼任務 1"}, origin: authored}
  stage1.t2.e.help_discovery: {kind: text, label: "我這一行的客人，通常是怎麼找到老師的？（選填）", optional: true, legacyKeys: [stage-01-2-answer-43], sourceRef: {file: 作業, heading: "2-E　查完之後，回頭看一眼任務 1"}, origin: authored}

  # ---- 任務 3 -----------------------------------------------------------
  stage1.t3.a.flow:
    kind: multi
    label: "第 1 格：流量（客人從哪來）"
    hint: "勾選你目前實際上的來源（可複選）"
    legacyKeys: [stage-01-3-answer-0]
    sourceRef: {file: 作業, heading: "3-A　四格現況表"}
    options:
      - {id: referral, label: "朋友或舊客介紹"}
      - {id: self_post, label: "我自己發 IG／FB，等人私訊"}
      - {id: platform, label: "平台派單（例如接案網站）"}
      - {id: ads, label: "付費廣告"}
      - {id: none, label: "目前沒有固定來源"}
  stage1.t3.a.flow_text: {kind: text, label: "一句話寫下來：我的客人主要來自", legacyKeys: [stage-01-3-answer-1], sourceRef: {file: 作業, heading: "3-A　四格現況表"}}
  stage1.t3.a.screen:
    kind: multi
    label: "第 2 格：篩選（誰值得談）"
    legacyKeys: [stage-01-3-answer-2]
    sourceRef: {file: 作業, heading: "3-A　四格現況表"}
    options:
      - {id: no_screen, label: "有人問我就談，不篩選"}
      - {id: mind_only, label: "我心裡有標準，但沒寫出來過"}
      - {id: written, label: "我有寫在某個地方，客人看得到"}
      - {id: none, label: "目前沒有"}
  stage1.t3.a.screen_text: {kind: text, label: "一句話寫下來：我篩選客人的方式是", legacyKeys: [stage-01-3-answer-3], sourceRef: {file: 作業, heading: "3-A　四格現況表"}}
  stage1.t3.a.close:
    kind: multi
    label: "第 3 格：成交（怎麼收錢）"
    legacyKeys: [stage-01-3-answer-4]
    sourceRef: {file: 作業, heading: "3-A　四格現況表"}
    options:
      - {id: quote, label: "對方問價格，我報價"}
      - {id: process, label: "我有固定的對談流程"}
      - {id: page, label: "有銷售頁或報價單"}
      - {id: none, label: "目前沒有"}
  stage1.t3.a.close_text: {kind: text, label: "一句話寫下來：我成交的方式是", legacyKeys: [stage-01-3-answer-5], sourceRef: {file: 作業, heading: "3-A　四格現況表"}}
  stage1.t3.a.deliver:
    kind: multi
    label: "第 4 格：交付（給他什麼）"
    legacyKeys: [stage-01-3-answer-6]
    sourceRef: {file: 作業, heading: "3-A　四格現況表"}
    options:
      - {id: one_on_one, label: "一對一"}
      - {id: group, label: "團體班"}
      - {id: online, label: "線上課程"}
      - {id: none, label: "目前沒有"}
  stage1.t3.a.deliver_text: {kind: text, label: "一句話寫下來：我交付的是", legacyKeys: [stage-01-3-answer-7], sourceRef: {file: 作業, heading: "3-A　四格現況表"}}
  stage1.t3.b.s1: {kind: single, label: "我說不出上個月的客人分別從哪來", legacyKeys: [stage-01-3-answer-8], sourceRef: {file: 作業, heading: "3-B　追客 or 篩客？自我檢測"}, options: [{id: yes, label: "是"}, {id: no, label: "否"}]}
  stage1.t3.b.s2: {kind: single, label: "我沒有拒絕過任何一個想付錢的人", legacyKeys: [stage-01-3-answer-9], sourceRef: {file: 作業, heading: "3-B　追客 or 篩客？自我檢測"}, options: [{id: yes, label: "是"}, {id: no, label: "否"}]}
  stage1.t3.b.s3: {kind: single, label: "有人問「可以便宜一點嗎」，我會猶豫", legacyKeys: [stage-01-3-answer-10], sourceRef: {file: 作業, heading: "3-B　追客 or 篩客？自我檢測"}, options: [{id: yes, label: "是"}, {id: no, label: "否"}]}
